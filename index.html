function safePointerLock(el) {
  if (!el || !el.requestPointerLock) return;

    const res = el.requestPointerLock();
    if (res && typeof res.catch === 'function') res.catch(() => {});
  } catch (err) {}
}

async function loadThree() {
  const urls = [
    'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js',
    'https://unpkg.com/three@0.170.0/build/three.module.js',
    'https://esm.sh/three@0.170.0'
  ];
  for (const url of urls) {
    let timeout;
    try {
      const limit = new Promise((_, reject) => {
        timeout = setTimeout(() => reject(new Error('Hết thời gian tải Three.js.')), 6000);
      });
      return await Promise.race([import(url), limit]);
    } catch {
      console.warn('Không tải được Three.js từ:', url);
    } finally {
      clearTimeout(timeout);
    }
  }
  throw new Error('Không tải được Three.js. Kiểm tra kết nối Internet rồi tải lại trang.');
}

function makeCurtainMesh(w, h){
  let g=new T.BufferGeometry(),v=[],u=[],ix=[];

      let a=j*(segX+1)+i, b=a+1, c=a+segX+1, d=c+1;

  g.setAttribute('uv',new T.Float32BufferAttribute(u,2));

  let o=new T.Mesh(g,cm);

  return o;

function normalizeKey(e){
  if(e.code==='ShiftLeft' || e.code==='ShiftRight') return e.code;
  if(['KeyW','KeyA','KeyS','KeyD','KeyE','KeyF','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Digit1','Digit2','Digit3','Space'].includes(e.code)) return e.code;
  const k=(e.key||'').toLowerCase();
  if(k==='w'||k==='ư') return 'KeyW';
  if(k==='a') return 'KeyA';
  if(k==='s') return 'KeyS';
  if(k==='d'||k==='đ') return 'KeyD';
  if(k==='e'||k==='ê') return 'KeyE';
  if(k==='f') return 'KeyF';
  return e.code;
}

});

window.addEventListener('keydown',e=>{
  if (!started) return;
  const code=normalizeKey(e);
  if (e.repeat && ['KeyT','KeyE','KeyF','Space','Digit1','Digit2','Digit3'].includes(code)) {
    e.preventDefault();
    return;
  }
  if(laptopFocus){
    if(/^Digit[1-5]$/.test(code)) showApp(Number(code.slice(-1))-1);
    else if(['Space','Escape','KeyE'].includes(code)){
      e.preventDefault();
      exitLaptopFocus(code==='KeyE');
    }
    return;
  }
  keys[code]=true;
  if(code==='KeyT' && inBasement) basement.flashlight.visible = !basement.flashlight.visible;
  if(code==='Space' && started){
    e.preventDefault();
    if(bathroom.isMirrorFocus()){
      const ret = bathroom.exitMirrorFocus();
      if(ret){ yaw = ret.yaw; pitch = ret.pitch; }
      return;
    }
    if(pose !== 'stand'){
      standUp();
    } else if(isGrounded){
      velY = 4.3;
      isGrounded = false;
    }
    return;
  }
  if(code==='KeyF' && started && isInsideWardrobe()){
    e.preventDefault();
    toggleClosetLight();
    return;
  }
  if(code==='KeyE'&&started){
    if(bathroom.isMirrorFocus()){
      const ret = bathroom.exitMirrorFocus();
      if(ret){ yaw = ret.yaw; pitch = ret.pitch; }
    } else if(pose === 'under_bed_1' || pose === 'under_bed_2'){
      standUp();
    } else if(current) {
      if(current.name === 'Gương soi') bathroom.syncAnglesFrom(yaw, pitch);
      const res = current.use();
      if(res && res.setAngles){ yaw = res.setAngles.yaw; pitch = res.setAngles.pitch; }
    }
    else if(pose !== 'stand') standUp();
  }
  if(started&&['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(code)) e.preventDefault();
});

window.addEventListener('keyup',e=>{keys[normalizeKey(e)]=false;});
window.addEventListener('blur',()=>{keys={};dragging=false;});

function blocked(x,z){
  if(inBasement) return basement.blocks(x,z,camera.position.x);
  if(basement.blocksFromAbove(x,z)) return true;
  if(lowerFloorHeight(x,z) !== null) return groundFloor.blocksFurniture(x,z);
  if(x < -4.15 || x > 19.20) return true;
  if(x <= 4.15 && (z < -3.15 || z > 3.15)) return true;
  if(x > 4.15 && x < 4.65 && (doorAngle < .5 || z < 1.42 || z > 2.38)) return true;

  // Khu vực nhà vệ sinh nối từ tường Bắc hành lang (x từ 7.20 -> 11.04, z <= 0.45)
  if(bathroom.blocksDoor(x,z)) return true;
  if(x > 7.20 && x < 11.04 && z < 0.45){
    if(bathroom.isBlocked(x, z)) return true;
  } else if(x > 4.15 && x < 11.12 && (z < .45 || z > 3.35)){
    return true;
  }

  if(x >= 11.12 && (z < -1.48 || z > 5.18)) return true;
  if(x > 10.88 && x < 11.42 && (guestDoorAngle < .5 || z < 1.42 || z > 2.38)) return true;
  if(z < -2.05 && z > -3.35){
    if(Math.abs(x - (-3.50)) < .20) return true;
    if(Math.abs(x - (-2.00)) < .20) return true;
  }
  if(x > -3.55 && x < -1.95 && z < -2.92) return true;
  if(wardrobeAngle < .8 && x > -3.52 && x < -1.98 && Math.abs(z - (-2.14)) < .22) return true;

  for(let [a,b,w,d] of blockers)
    if(Math.abs(x-a)<w/2+.22&&Math.abs(z-b)<d/2+.22) return true;
  return false;
}

let clock=new T.Clock();
const lookDirection = new T.Vector3();
const targetOffset = new T.Vector3();
function animate(){
  requestAnimationFrame(animate);
  const frameSeconds = clock.getDelta();
  const dt = Math.min(frameSeconds, .066);
  if (renderBudget.sample(frameSeconds, started && !document.hidden)) applyRenderScale();
  if(laptopFocus && screenView!=='Camera') return;
  if(started && !laptopFocus){
    const wasInBasement = inBasement;
    const previousFloor = walkingFloor(camera.position.x,camera.position.z);
    let f=((keys.KeyW||keys.ArrowUp)?1:0)-((keys.KeyS||keys.ArrowDown)?1:0),
        s=((keys.KeyD||keys.ArrowRight)?1:0)-((keys.KeyA||keys.ArrowLeft)?1:0);
    if(!laptopFocus && !bathroom.isMirrorFocus() && pose === 'stand' && (f||s)){
      let l=Math.hypot(f,s);f/=l;s/=l;
      const steps = dt > .04 ? 2 : 1;
      const walkSpeed = 2.65;
      const sprintMultiplier = keys.ShiftLeft || keys.ShiftRight ? 1.3 : 1;
      const distance = walkSpeed * sprintMultiplier * dt / steps;
      const dx = (-Math.sin(yaw)*f+Math.cos(yaw)*s)*distance;
      const dz = (-Math.cos(yaw)*f-Math.sin(yaw)*s)*distance;
      for (let step = 0; step < steps; step++) {
        if(!blocked(camera.position.x+dx,camera.position.z)) camera.position.x+=dx;
        if(!blocked(camera.position.x,camera.position.z+dz)) camera.position.z+=dz;
        if(!inBasement && basement.canDescend(camera.position.x,camera.position.z)){
          inBasement=true;
        } else if(inBasement && basement.inLane(camera.position.x) && camera.position.z<=cellar.firstStep){
          inBasement=false;
          basement.flashlight.visible=false;
        }
      }
    }

    if(!bathroom.isMirrorFocus() && pose === 'stand'){
      const floor = walkingFloor(camera.position.x,camera.position.z);
      const standingHeight = floor + standEyeY;
      // Keep contact on ordinary steps, but fall from the exposed side of the stairs.
      if(!wasInBasement && inBasement && previousFloor-floor>.2) isGrounded=false;
      if(isGrounded){
        camera.position.y = floor + T.MathUtils.damp(camera.position.y-previousFloor, standEyeY, 18, dt);
      } else {
        const gravity = 11.5;
        camera.position.y += velY*dt - .5*gravity*dt*dt;
        velY -= gravity*dt;
        const ceiling = inBasement && camera.position.z>cellar.coverEnd
          ? Math.min(floor+2.92,cellar.upper-.32) : floor+2.92;
        if(velY>0 && camera.position.y>=ceiling){
          camera.position.y=ceiling;
          velY=0;
        }
        if(camera.position.y<=standingHeight){
          camera.position.y=standingHeight;
          velY=0;
          isGrounded=true;
        }
      }
      const level = inBasement ? 'Tầng hầm' : isOutside(camera.position.z,camera.position.x) ? (camera.position.z<house.front ? 'Lối sau nhà' : 'Sân trước') : floor === 0 ? 'Tầng hai' : 'Tầng một';
      if (floorLabel.textContent !== level) floorLabel.textContent = level;
    } else if(pose === 'sit' || pose === 'sit2' || pose === 'vanity'){
      camera.position.y = T.MathUtils.damp(camera.position.y, 1.24, 10, dt);
    } else if(pose === 'bed'){
      camera.position.y = T.MathUtils.damp(camera.position.y, 0.98, 8, dt);
    } else if(pose === 'bed2'){
      camera.position.y = T.MathUtils.damp(camera.position.y, 1.02, 8, dt);
    } else if(pose === 'under_bed_1' || pose === 'under_bed_2'){
      camera.position.y = T.MathUtils.damp(camera.position.y, 0.22, 10, dt);
    }

    camera.rotation.order='YXZ';
    camera.rotation.y=yaw;
    camera.rotation.x=pitch;
    camera.rotation.z = T.MathUtils.damp(camera.rotation.z, (!laptopFocus && !bathroom.isMirrorFocus() && (pose === 'bed' || pose === 'bed2')) ? 0.06 : 0, 8, dt);

    lookDirection.set(0,0,-1).applyEuler(camera.rotation);
    let score=99;
    current=null;
    const inCloset = isInsideWardrobe();
    if(!laptopFocus && !bathroom.isMirrorFocus()){
      for(let t of (inBasement ? [] : targets)){
        if(t.available && !t.available()) continue;
        if(t.name==='Công tắc đèn trong tủ' && wardrobeAngle<.8 && !inCloset) continue;
        const v=targetOffset.copy(t.pos).sub(camera.position),d=v.length();
        let maxDist = (t.name==='Cửa tủ quần áo' && inCloset) ? 2.5 : ((t.name==='Giường ngủ' || t.name==='Giường ngủ phòng ngủ') ? 2.75 : 2.35);
        let minDot = ((t.name==='Cửa tủ quần áo' || t.name==='Công tắc đèn trong tủ') && inCloset) ? 0.35 : 0.60;
        const alignment=v.dot(lookDirection)/d;
        const aimedAtScreen=(t.name==='Laptop' || t.name==='Laptop gaming') && alignment>.985;
        const priority=aimedAtScreen ? d-maxDist : d;
        if(d<maxDist && priority<score && alignment>minDot){current=t;score=priority;}
      }
    }

    if(bathroom.isMirrorFocus()){
      hint.style.display='block';
      hint.textContent='Đang soi gương · Di chuột nhìn quanh · [ Space / E ] Rời gương';

    } else if(pose === 'under_bed_1' || pose === 'under_bed_2'){
      hint.style.display='block';
      hint.textContent='Đang trốn dưới gầm giường · Nhấn [ Space ] hoặc [ E ] để chui ra';
    } else if(current){
      hint.style.display='block';
      if(current.name==='Ghế bàn học') hint.textContent = pose==='sit' ? '[ E / Space ]  Đứng dậy' : '[ E ]  Ngồi vào ghế';
      else if(current.name==='Ghế bàn học phòng ngủ') hint.textContent = pose==='sit2' ? '[ E / Space ]  Đứng dậy' : '[ E ]  Ngồi vào ghế';
      else if(current.name==='Bàn trang điểm') hint.textContent = pose==='vanity' ? '[ E / Space ]  Đứng dậy' : '[ E ]  Ngồi soi gương';
      else if(current.name==='Giường ngủ') hint.textContent = pose==='bed' ? '[ E / Space ]  Đứng dậy khỏi giường' : '[ E ]  Nằm lên giường';
      else if(current.name==='Giường ngủ phòng ngủ') hint.textContent = pose==='bed2' ? '[ E / Space ]  Đứng dậy khỏi giường' : '[ E ]  Nằm lên giường';
      else if(current.name==='Gầm giường' || current.name==='Gầm giường phòng ngủ') hint.textContent = '[ E ]  Chui xuống gầm giường trốn';
      else if(current.name==='Công tắc đèn') hint.textContent = '[ E ]  ' + (lightOn ? 'Tắt đèn phòng' : 'Bật đèn phòng');
      else if(current.name==='Công tắc đèn ngủ trái') hint.textContent = '[ E ]  ' + (leftNightOn ? 'Tắt đèn ngủ trái' : 'Bật đèn ngủ trái');
      else if(current.name==='Công tắc đèn ngủ phải') hint.textContent = '[ E ]  ' + (rightNightOn ? 'Tắt đèn ngủ phải' : 'Bật đèn ngủ phải');
      else if(current.name==='Công tắc đèn trong tủ') hint.textContent = '[ E / F ]  ' + (closetLightOn ? 'Tắt đèn trong tủ' : 'Bật đèn trong tủ');
      else if(current.name==='Cửa tủ quần áo') hint.textContent = '[ E ]  ' + (wardrobeTarget>.5 ? 'Đóng cửa tủ' : 'Mở cửa tủ');
      else if(current.name==='Laptop' || current.name==='Laptop gaming') hint.textContent='[ Chuột trái / E ]  Mở laptop';
      else if(current===hatchTarget) hint.textContent='[ Chuột trái / E ]  '+(basement.opened ? 'Đóng nắp hầm' : 'Mở nắp hầm');
      else if(current.name==='Gương soi') hint.textContent = '[ E ]  Soi gương';
      else hint.textContent='[ E ]  Tương tác · '+current.name;
    } else if(pose === 'sit' || pose === 'sit2'){
      hint.style.display='block';
      hint.textContent='Đang ngồi ghế · Nhấn [ Space ] hoặc [ E ] để đứng dậy';
    } else if(pose === 'vanity'){
      hint.style.display='block';
      hint.textContent='Đang ngồi soi gương · Nhấn [ Space ] hoặc [ E ] để đứng dậy';
    } else if(pose === 'bed' || pose === 'bed2'){
      hint.style.display='block';
      hint.textContent='Đang nằm trên giường · Nhấn [ Space ] hoặc [ E ] để đứng dậy';
    } else if(inBasement && !basement.flashlight.visible){
      hint.style.display='block';
      hint.textContent='[ T ]  Bật đèn pin';
    } else if(inCloset){
      hint.style.display='block';
      hint.textContent=`Đang ở trong tủ · [ F ] ${closetLightOn ? 'Tắt' : 'Bật'} đèn tủ · Nhìn cửa tủ nhấn [ E ] để đóng/mở`;
    } else {
      hint.style.display='none';
    }


  }

  if(fanOn) rotor.rotation.z-=dt*8;
  doorAngle=T.MathUtils.damp(doorAngle,doorTarget,4,dt);
  door.rotation.y=-doorAngle;
  guestDoorAngle=T.MathUtils.damp(guestDoorAngle,guestDoorTarget,4,dt);
  guestDoor.rotation.y=-guestDoorAngle;
  if(bedroomFanOn) nineRotor.rotation.y+=dt*2.8;
  wardrobeAngle=T.MathUtils.damp(wardrobeAngle,wardrobeTarget,4.5,dt);
  wleft.rotation.y=-wardrobeAngle;
  wright.rotation.y=wardrobeAngle;

  closetLight.distance = wardrobeAngle < 0.25 ? 1.45 : 3.2;

  curtainState=T.MathUtils.damp(curtainState,curtainOpen?0:1,4,dt);
  curtainLeft.position.x = T.MathUtils.lerp(-1.22, -0.66, curtainState);
  curtainRight.position.x = T.MathUtils.lerp(1.02, 0.46, curtainState);
  curtainLeft.scale.x = T.MathUtils.lerp(0.68, 1.15, curtainState);
  curtainRight.scale.x = T.MathUtils.lerp(0.68, 1.15, curtainState);

  if(lightOn){
    lamp.intensity = 35 + Math.sin(performance.now()*.002)*1.2 + (Math.random()<.002?-10:0);
    creepyRedLight.intensity = 0;
  } else {
    lamp.intensity = 0;
    creepyRedLight.intensity = 2.1 + Math.sin(performance.now()*.0025)*0.22;
  }

  basement.update(dt);
  if(laptopFocus){
    const now=performance.now();
    const lens=securityCameras[selectedChannel];
    groundFloor.update(dt,lens.position);
    if(now>=nextFeedFrame){
      renderer.render(scene,lens);
      feedContext.drawImage(renderer.domElement,0,0,feed.width,feed.height);
      nextFeedFrame=now+1000/12;
    }
    return;
  }
  if(!inBasement) bathroom.update(dt, started, yaw, pitch);
  groundFloor.update(dt);
  const halfFov=Math.atan(camera.aspect*Math.tan(T.MathUtils.degToRad(camera.getEffectiveFOV())/2));
  drawMinimap(camera.position,yaw,floorLabel.textContent,halfFov,{
    bedroom:doorAngle>.5,guest:guestDoorAngle>.5,bathroom:bathroom.doorOpen,front:groundFloor.doorOpen
  });
  renderer.render(scene,camera);
  if(basement.opened && (inBasement || camera.position.distanceTo(hatchCenter)<8)){
    basement.aimFlashlight(camera,lookDirection);
    renderer.autoClear=false;
    renderer.render(basement.scene,camera);
    renderer.autoClear=true;
  }
}

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  resizeRenderer();
});
window.addEventListener('contextmenu',e=>e.preventDefault());
startBtn.addEventListener('click', () => {
  started = true;
  overlay.style.display = 'none';
  safePointerLock(renderer.domElement);
});
animate();
statusText.textContent = 'Nhấn E để mở cửa và khám phá ngôi nhà.';
startBtn.disabled = false;
}

init().catch(error => {
  console.error(error);
  statusText.style.color = '#ff8a80';
  statusText.textContent = location.protocol === 'file:' ?
    'Hãy mở game bằng Chay-game.bat hoặc serve_game.py.' :
    'Không thể mở game. Kiểm tra kết nối Internet và hỗ trợ WebGL rồi tải lại trang.';
});
</script></body></html>
